<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbe7e7"><title>Thiệp cưới Minh Luật & Đỗ Vân</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--red:#b30d27;--pink:#fbe6e6;--ink:#272024}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Montserrat,sans-serif;color:var(--ink)}body{background:radial-gradient(ellipse at top,#fffaf9,#f7e5e4 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;overflow-x:hidden}.top{width:min(94vw,560px);display:flex;align-items:center;justify-content:space-between;margin:14px auto 8px;gap:12px}.brand{font-family:'Playfair Display',serif;color:var(--red);font-size:15px;letter-spacing:.03em}.switch{display:flex;border:1px solid #e8c5c5;border-radius:40px;padding:3px;background:#fff9f8}.switch button{border:0;background:transparent;border-radius:30px;padding:9px 13px;color:#794f55;font-size:12px;cursor:pointer}.switch button.active{background:var(--red);color:white}.stage{width:min(94vw,480px);height:min(76dvh,690px);min-height:410px;position:relative;perspective:1200px;display:grid;place-items:center;cursor:pointer;touch-action:pan-y}.sheet{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:enter .65s cubic-bezier(.2,.7,.2,1) both}.sheet img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 22px #6e3b3b23)}@keyframes enter{from{opacity:0;transform:translateY(25px) rotateX(-5deg) scale(.97)}to{opacity:1;transform:none}}.cover{width:100%;height:100%;background:var(--pink);border:1px solid #c99d9d;box-shadow:0 20px 50px #8d4a4a25;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:8% 9% 10%;text-align:center}.cover:before{content:'';position:absolute;inset:12px;border:1px solid #a76c733d;pointer-events:none}.save{font-family:'Playfair Display',serif;font-size:clamp(38px,10vw,70px);color:var(--red);line-height:.94;text-align:left;letter-spacing:-.06em}.save em{display:block;font-family:'Great Vibes',cursive;font-size:1.2em;font-weight:400;line-height:.9;letter-spacing:0;padding-left:22px}.coverbottom{align-self:flex-end;text-align:right;width:100%}.names{font-family:'Great Vibes',cursive;color:var(--red);font-size:clamp(36px,9vw,58px);line-height:1.2;white-space:normal}.date{font-family:'Playfair Display',serif;font-size:clamp(28px,7vw,40px);font-weight:700;color:var(--red);margin:8px 0 15px}.invite{font-family:'Playfair Display',serif;font-size:14px}.dots{border-bottom:2px dotted #443c3c;width:70%;margin:28px 0 0 auto}.envelope-scene{position:relative;width:100%;height:76%;display:grid;place-items:center;animation:enter .7s both}.env-back{position:absolute;width:94%;height:61%;bottom:6%;background:#edc7c8;border:1px solid #cfaaaa;box-shadow:0 20px 45px #80484832}.env-back:before{content:'';position:absolute;inset:0;background:linear-gradient(145deg,transparent 49.7%,#e6b6bb 50%) left/50% 100% no-repeat,linear-gradient(215deg,transparent 49.7%,#e6b6bb 50%) right/50% 100% no-repeat}.flap{position:absolute;bottom:67%;height:37%;width:94%;background:#f4d6d8;clip-path:polygon(0 100%,50% 0,100% 100%);border-bottom:1px solid #d3a6a8;filter:drop-shadow(0 -2px 2px #8b555522)}.stack{position:absolute;width:66%;height:72%;bottom:16%;display:grid;place-items:center}.mini{position:absolute;width:78%;height:85%;background:white;border:1px solid #cfa8a8;box-shadow:0 6px 15px #6b363633;display:grid;place-items:center;font-family:'Playfair Display',serif;color:var(--red);font-size:21px;text-align:center}.mini:nth-child(1){transform:translate(-20px,-15px) rotate(-12deg);background:#fbe5e6}.mini:nth-child(2){transform:translate(17px,-26px) rotate(9deg)}.mini:nth-child(3){transform:translate(0,-40px) rotate(-2deg);background:#fffafa}.mini span{font-size:42px}.env-front{position:absolute;bottom:6%;width:94%;height:34%;background:#f8dddd;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-bottom:1px solid #d7aaaa}.env-title{position:absolute;bottom:0;color:#9e2336;font-family:'Great Vibes',cursive;font-size:32px}.qr-page{width:100%;height:100%;background:#fff;border:1px solid #555;padding:10% 7%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;box-shadow:0 16px 40px #8d4a4a25}.qr-page h2{font-family:'Playfair Display',serif;color:var(--red);font-size:clamp(25px,6vw,37px);margin:0}.qr-page p{font-size:14px;line-height:1.7;margin:0}.qr-page img{width:min(65%,270px);height:auto;aspect-ratio:1;object-fit:contain;filter:none}.mapbtn{display:inline-block;text-decoration:none;background:var(--red);color:white;padding:14px 22px;border-radius:30px;font-weight:600;font-size:13px}.controls{width:min(94vw,480px);display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px auto 20px}.ctrl{border:1px solid #d8afb1;background:#fff9f9;color:#92263b;border-radius:25px;padding:12px 17px;cursor:pointer;font-size:13px}.ctrl:disabled{opacity:.3;cursor:default}.hint{font-size:12px;text-align:center;color:#81545b}.steps{display:flex;gap:6px;justify-content:center;margin-bottom:7px}.dot{height:6px;width:6px;background:#e6c1c3;border-radius:10px}.dot.on{width:23px;background:var(--red)}.footer{font-size:11px;color:#a27378;margin-bottom:12px;text-align:center}@media(max-width:600px){.stage{height:min(73dvh,650px);min-height:390px}.top{margin-top:9px}.controls{margin-top:8px}.cover{padding:10% 8%}.names{font-size:clamp(35px,10vw,53px)}.save{font-size:clamp(40px,12vw,62px)}}@media(max-height:690px){.stage{height:70dvh;min-height:340px}.top{margin:5px auto}.controls{margin:5px auto}.cover{padding:6% 8%}.dots{margin-top:12px}}
</style></head><body><header class="top"><div class="brand">Minh Luật <span style="font-family:serif">&</span> Đỗ Vân</div><div class="switch"><button id="traiBtn">Nhà trai</button><button id="gaiBtn">Nhà gái</button></div></header><main id="stage" class="stage" role="button" tabindex="0" aria-label="Bấm để mở thiệp"></main><div class="controls"><button class="ctrl" id="back">← Quay lại</button><div><div class="steps" id="dots"></div><div class="hint" id="hint"></div></div><button class="ctrl" id="next">Tiếp theo →</button></div><div class="footer">Trân trọng kính mời bạn chung vui cùng gia đình chúng tôi ♡</div><script>
const config={trai:{name:'Nhà trai',names:'Minh Luật & Đỗ Vân',address:'Thôn Đông Am Vàng, Việt Lập, Tân Yên, TP. Bắc Ninh',map:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Thôn Đông Am Vàng, Việt Lập, Tân Yên, Bắc Ninh')},gai:{name:'Nhà gái',names:'Đỗ Vân & Minh Luật',address:'Số 30 Đường Đàng Tây, Thôn Hạ, Xã Phượng Dực, TP. Hà Nội',map:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Số 30 Đường Đàng Tây, Thôn Hạ, Xã Phượng Dực, Hà Nội')}};
const query=new URLSearchParams(location.search);let side=query.get('side')==='gai'?'gai':'trai',step=0;const stage=document.getElementById('stage');const labels=['Phong bì','Mở phong bì','Tờ lễ','Tờ tiệc','Chỉ đường'];function render(){const c=config[side];document.getElementById('traiBtn').classList.toggle('active',side==='trai');document.getElementById('gaiBtn').classList.toggle('active',side==='gai');document.getElementById('back').disabled=step===0;document.getElementById('next').disabled=step===4;document.getElementById('dots').innerHTML=labels.map((_,i)=>`<span class="dot ${i===step?'on':''}"></span>`).join('');document.getElementById('hint').textContent=`${step+1}/5 · ${labels[step]}`;let html='';if(step===0){html=`<section class="sheet"><div class="cover"><div class="save">SAVE<em>the</em>DATE</div><div class="coverbottom"><div class="names">${c.names}</div><div class="date">29.11.2026</div><div class="invite">TRÂN TRỌNG KÍNH MỜI</div><div class="dots"></div></div></div></section>`}else if(step===1){html=`<section class="sheet"><div class="envelope-scene"><div class="env-back"></div><div class="flap"></div><div class="stack"><div class="mini">MÃ QR<br><span>⌖</span></div><div class="mini">THIỆP MỜI<br> DỰ TIỆC</div><div class="mini">${side==='trai'?'LỄ THÀNH HÔN':'LỄ VU QUY'}<br>♡</div></div><div class="env-front"></div><div class="env-title">${c.name} · Minh Luật & Đỗ Vân</div></div></section>`}else if(step===2||step===3){html=`<section class="sheet"><img src="assets/${side}-${step===2?'ceremony':'party'}.webp" alt="${labels[step]} ${c.name}" draggable="false"></section>`}else{html=`<section class="sheet"><div class="qr-page"><div style="font-family:'Great Vibes',cursive;color:var(--red);font-size:43px">Minh Luật & Đỗ Vân</div><h2>CHỈ ĐƯỜNG ĐẾN ${c.name.toUpperCase()}</h2><p>Quét mã QR để mở bản đồ</p><img src="assets/${side}-qr.png" alt="Mã QR Google Maps ${c.name}"><p>${c.address}</p><a class="mapbtn" href="${c.map}" target="_blank" rel="noopener">📍 Mở Google Maps</a></div></section>`}stage.innerHTML=html;history.replaceState(null,'',location.pathname+'?side='+side);}function forward(){if(step<4){step++;render()}}function backward(){if(step>0){step--;render()}}stage.addEventListener('click',e=>{if(e.target.closest('a'))return;forward()});stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();forward()}});document.getElementById('next').onclick=forward;document.getElementById('back').onclick=backward;for(const s of ['trai','gai'])document.getElementById(s+'Btn').onclick=()=>{side=s;step=0;render()};let x=0;stage.addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>65){if(d<0)forward();else backward()}},{passive:true});render();
</script></body></html>
